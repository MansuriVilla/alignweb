<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainmaker Text Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0f1c;
            --text-color: #ffffff;
            --glow-color: #00d4ff;
            --font-family: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: var(--font-family);
        }

        .reveal-container {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .text-wrapper {
            position: relative;
        }

        .text-layer {
            font-size: clamp(3rem, 12vw, 9rem);
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            line-height: 1;
            white-space: nowrap;
        }

        /* Base Outline Layer */
        .text-outline {
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.25);
        }

        /* Fill Layer - positioned on top */
        .text-fill {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Individual character styling */
        .text-fill .char {
            display: inline-block;
            color: transparent;
            background: linear-gradient(
                90deg,
                var(--text-color) 0%,
                var(--text-color) 35%,
                var(--glow-color) 45%,
                rgba(255, 255, 255, 0.95) 50%,
                var(--glow-color) 55%,
                transparent 65%,
                transparent 100%
            );
            background-size: 300% 100%;
            background-position: 100% 0; /* Start hidden */
            -webkit-background-clip: text;
            background-clip: text;
        }

        /* Glow/Bloom Layer */
        .text-glow {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .text-glow .char {
            display: inline-block;
            color: transparent;
            background: linear-gradient(
                90deg,
                transparent 0%,
                transparent 38%,
                var(--glow-color) 45%,
                rgba(255, 255, 255, 1) 50%,
                var(--glow-color) 55%,
                transparent 62%,
                transparent 100%
            );
            background-size: 300% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            filter: blur(10px);
            opacity: 0.9;
        }

        /* Subtle background pattern */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.04;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 60px,
                    rgba(0, 212, 255, 0.15) 60px,
                    rgba(0, 212, 255, 0.15) 61px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 60px,
                    rgba(0, 212, 255, 0.15) 60px,
                    rgba(0, 212, 255, 0.15) 61px
                );
        }

        .replay-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.75rem;
            font-style: normal;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="reveal-container" id="revealContainer">
        <div class="text-wrapper">
            <h1 class="text-layer text-outline" id="textOutline">RAINMAKER</h1>
            <h1 class="text-layer text-glow" id="textGlow">RAINMAKER</h1>
            <h1 class="text-layer text-fill" id="textFill">RAINMAKER</h1>
        </div>
    </div>

    <p class="replay-hint">Click to replay</p>

    <!-- GSAP Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- GSAP SplitText Plugin (Club GreenSock) - Using a free alternative approach -->
    <script>
        // Simple SplitText implementation (wraps each character in a span)
        function splitTextIntoChars(element) {
            const text = element.textContent;
            element.innerHTML = '';
            const chars = [];
            
            for (let i = 0; i < text.length; i++) {
                const char = document.createElement('span');
                char.className = 'char';
                char.textContent = text[i];
                char.style.display = 'inline-block';
                element.appendChild(char);
                chars.push(char);
            }
            
            return chars;
        }

        const container = document.getElementById('revealContainer');
        const textFill = document.getElementById('textFill');
        const textGlow = document.getElementById('textGlow');
        const textOutline = document.getElementById('textOutline');

        // Split text into characters
        const fillChars = splitTextIntoChars(textFill);
        const glowChars = splitTextIntoChars(textGlow);

        function playReveal() {
            const tl = gsap.timeline();

            // Reset all characters
            gsap.set(fillChars, { backgroundPosition: '100% 0' });
            gsap.set(glowChars, { backgroundPosition: '100% 0' });
            gsap.set(textOutline, { opacity: 0 });

            // Phase 1: Fade in the outline
            tl.to(textOutline, {
                opacity: 1,
                duration: 0.6,
                ease: "power2.out"
            })
            // Phase 2: Animate each character's gradient with a stagger
            .to(fillChars, {
                backgroundPosition: '0% 0',
                duration: 0.5,
                ease: "power2.inOut",
                stagger: {
                    each: 0.06, // Delay between each letter
                    from: "start"
                }
            }, "+=0.2")
            // Glow layer follows with slight offset
            .to(glowChars, {
                backgroundPosition: '0% 0',
                duration: 0.5,
                ease: "power2.inOut",
                stagger: {
                    each: 0.06,
                    from: "start"
                }
            }, "<"); // "<" means start at the same time as the previous animation
        }

        // Run on load and on click
        window.addEventListener('load', () => {
            setTimeout(playReveal, 600);
        });

        container.addEventListener('click', playReveal);
    </script>
</body>
</html>
